<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AulaNote</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 300px;
            padding: 15px;
            text-align: center;
            background-color: #f8f9fa;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-stop {
            background-color: #e74c3c;
            display: none;
        }
        .btn-stop:hover {
            background-color: #c0392b;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <h2>AulaNote</h2>
    <p>Resuma suas aulas com IA</p>

    <!-- Campos para criar a sessão -->
    <input type="text" id="tituloAula" placeholder="Título da Aula (ex: Java)" style="width: 90%; padding: 8px; margin-bottom: 15px;">

    <!-- Botões de Ação -->
    <button id="btnStart" class="btn">▶️ Iniciar Gravação</button>
    <button id="btnStop" class="btn btn-stop">⏹️ Parar e Gerar Resumo</button>

    <div id="status"></div>

    <!-- Caixa onde o resumo vai aparecer -->
    <div id="resultadoBox" style="display: none; margin-top: 15px; text-align: left;">
        <h4 style="color: #2c3e50; margin-bottom: 5px;">Resumo Gerado:</h4>
        <textarea id="textoResumo" readonly style="width: 100%; height: 150px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: inherit; font-size: 13px; resize: none;"></textarea>
    </div>

    <script src="popup.js"></script>
</body>
</html>
